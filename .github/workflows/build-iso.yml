name: Build fkOs ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - name: Create rootfs
        run: |
          sudo debootstrap --variant=minbase noble /tmp/fkos-rootfs http://archive.ubuntu.com/ubuntu

      - name: Configure rootfs
        run: |
          # 1. Mengaitkan direktori kernel host ke dalam chroot rootfs
          sudo mount -t proc /proc /tmp/fkos-rootfs/proc
          sudo mount -t sysfs /sys /tmp/fkos-rootfs/sys
          sudo mount --bind /dev /tmp/fkos-rootfs/dev
          sudo mount --bind /dev/pts /tmp/fkos-rootfs/dev/pts

          # 2. Menjalankan perintah chroot dengan aman
          sudo chroot /tmp/fkos-rootfs /bin/bash -c "apt-get update && apt-get install -y linux-image-generic systemd"

          # 3. Bersih-bersih (Unmount) setelah selesai agar tidak mengunci runner
          sudo umount -l /tmp/fkos-rootfs/dev/pts
          sudo umount -l /tmp/fkos-rootfs/dev
          sudo umount -l /tmp/fkos-rootfs/sys
          sudo umount -l /tmp/fkos-rootfs/proc

      - name: Build ISO (placeholder)
        run: |
          echo "ISO build steps go here"
          # TODO: implement full ISO creation with GRUB + squashfs

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: fkOs-iso
          path: fkOs.iso
